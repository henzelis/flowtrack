<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowSphera by TELESPHERA</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/echarts.min.js"></script>
<script src="vendor/world.js"></script>
<script src="vendor/echarts-gl.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <canvas class="logo" data-logo aria-hidden="true"></canvas>
      <div><b>FlowSphera</b><small><span class="by">by TELESPHERA</span> <button class="edbadge" id="edBadge" hidden></button></small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections" data-t-attr="aria-label"></nav>
    <div class="health">
      <div class="coll"><span class="dot" id="collDot"></span><b id="collState" data-t>Collector</b><span id="expCount">—</span></div>
      <div class="ingest glass"><div class="k" id="ingK" data-t>Ingest</div><div class="v" id="ingV">—</div><div class="meter"><i id="ingM" style="width:0"></i></div><svg id="ingS" width="100%" height="30" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <label class="search glass"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.5 12.5l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="q" placeholder="Search and filter: IP, network, service, country, port… — click here for every filter" autocomplete="off" aria-label="Search and filter" data-t-attr="placeholder aria-label"><kbd>/</kbd></label>
      <label class="sel glass" id="devLbl" title="Exporter device" data-t-attr="title"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 13h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><select id="devSel" aria-label="Device" data-t-attr="aria-label"></select></label>
      <label class="sel glass" id="trafLbl" title="Traffic" data-t-attr="title"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h9l-2.5-2.5M14 11H5l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <select id="trafSel" aria-label="Traffic" data-t-attr="aria-label"><option value="internet" data-t selected>Internet</option><option value="internal" data-t>Internal</option><option value="all" data-t>All traffic</option></select></label>
      <label class="sel glass" id="rangeLbl" title="Period" data-t-attr="title"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <select id="rangeSel" aria-label="Period" data-t-attr="aria-label"><option value="1h" data-t>Last hour</option><option value="6h" data-t>Last 6 hours</option><option value="24h" data-t selected>Last 24 hours</option><option value="7d" data-t>Last 7 days</option><option value="30d" data-t>Last 30 days</option></select></label>
      <button class="iconbtn glass" aria-label="Report for this period" title="Report for this period" id="repBtn" data-t-attr="aria-label title"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 2h6.5l3 3v11h-9.5zM11 2v3h3M7 9.5h4.5M7 12.5h4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <button class="iconbtn glass" aria-label="Events" id="bell" data-t-attr="aria-label"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 12.5V8a4.5 4.5 0 0 1 9 0v4.5l1.5 1.5h-12zM7.5 16h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="badge" id="bellBadge" hidden></span></button>
      <div class="user-wrap" id="userWrap"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="view"></div>
    <p class="foot-note"><span id="ftVer">FlowSphera</span> · <span id="geoAttr">IP Geolocation by <a href="https://db-ip.com" rel="noopener">DB-IP</a></span></p>
  </main>
</div>
<div id="drawerRoot"></div>
<script src="brand.js"></script>
<script src="boot.js"></script>
</body>
</html>
